[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equitylens"
version = "0.1.0"
description = "Pluggable multi-factor equity research framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
plugins = [
    "polygon-api-client>=1.14",
]
edgar = [
    "requests>=2.31",
]
finnhub = [
    "requests>=2.31",
]
text = [
    "transformers>=4.40",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/ShuoLi/equitylens-framework"
Issues = "https://github.com/ShuoLi/equitylens-framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/equitylens"]

[tool.ruff]
line-length = 100
target-version = "py310"
